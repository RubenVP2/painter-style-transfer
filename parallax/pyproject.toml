[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-service"
version = "0.1.0"
description = "FastAPI microservice wrapping DepthFlow (images to 3D parallax videos)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "depthflow",
    "python-multipart",
]

[project.optional-dependencies]
# `pip install -e '.[test]'` — the tests stub out the render so they run
# without depthflow/torch (httpx backs FastAPI's TestClient).
test = [
    "pytest",
    "httpx",
]

[tool.setuptools]
py-modules = ["service"]
