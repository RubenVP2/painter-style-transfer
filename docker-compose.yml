# Pile complète du dépôt, POUR LE LOCAL : le studio Next.js et le service parallaxe.
#
# Ce fichier publie le port du studio sur l'hôte. Sur Dokploy, dont le Traefik
# tient déjà les ports 80/443 et dont l'interface écoute sur le 3000, cela
# échoue avec « Bind for 0.0.0.0:3000 failed: port is already allocated » — et
# publier un port n'y sert à rien, Traefik joignant les conteneurs par son
# réseau. Le déploiement utilise donc `docker-compose.dokploy.yml`.
#
# Ce fichier vit à la RACINE parce que l'image du studio a besoin de `web/` et
# de `prompts/`, et que celle du parallaxe a besoin de `parallax/` : un contexte
# limité à `web/` ne peut pas construire la pile (c'est aussi ce que lit Dokploy
# en type « Compose », qui clone tout le dépôt).
#
#   docker compose up --build          # studio sur :3000
#
# Le NAVIGATEUR n'appelle plus le parallaxe directement : il appelle
# /api/parallax/* sur l'origine du studio, qui relaie CÔTÉ SERVEUR vers le
# parallaxe par le réseau interne `painter` (`PARALLAX_INTERNAL_URL`). Le
# parallaxe reste donc privé — pas de port obligatoire, pas de CORS. Son port
# n'est publié ici que par commodité de debug (curl direct sur :8100).

services:
  parallax:
    build:
      context: ./parallax
    image: parallax-service
    restart: unless-stopped
    # Publié uniquement pour le debug local (curl http://localhost:8100/health).
    # Le studio, lui, joint le parallaxe par le réseau interne, pas par ce port.
    ports:
      - "${PARALLAX_PORT:-8100}:8100"
    healthcheck:
      # python-slim n'a ni curl ni wget : l'interpréteur fait l'affaire.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      # Le premier import charge torch + depthflow : lent au démarrage à froid.
      start_period: 180s
      retries: 5
    networks:
      - painter

  studio:
    build:
      # La racine du dépôt : l'image a besoin de `web/` ET de `prompts/`.
      context: .
      dockerfile: web/Dockerfile
    image: wallpaper-mockup-studio
    restart: unless-stopped
    environment:
      # URL du parallaxe telle que le STUDIO la joint côté serveur (réseau
      # interne). Variable de runtime : la changer ne demande pas de rebuild.
      PARALLAX_INTERNAL_URL: ${PARALLAX_INTERNAL_URL:-http://parallax:8100}
    depends_on:
      parallax:
        # Le studio démarre sans le parallaxe (le panneau affiche un repli),
        # mais attendre évite une première visite avec le service annoncé mort.
        condition: service_healthy
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    networks:
      - painter

networks:
  painter:
    driver: bridge
