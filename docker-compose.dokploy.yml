# Déploiement Dokploy (type « Compose »).
#
# Différence unique mais décisive avec le `docker-compose.yml` de la racine :
# AUCUN port n'est publié sur l'hôte.
#
# Dokploy fait tourner son propre Traefik, qui détient déjà les ports 80/443 de
# la VPS, et son interface d'administration écoute sur le 3000. Un service qui
# demande `ports: - "3000:3000"` réclame donc un port que le démon Docker a déjà
# attribué, et le déploiement casse au démarrage du conteneur :
#
#   Bind for 0.0.0.0:3000 failed: port is already allocated
#
# Publier un port n'apporte de toute façon rien ici : Traefik joint les
# conteneurs par le réseau `dokploy-network`, pas par l'hôte. `expose` suffit —
# il documente le port d'écoute sans le réserver sur la machine.
#
# ── À régler dans l'interface Dokploy ────────────────────────────────────────
#
# Onglet « Domains » : UN SEUL domaine, pour le studio. Le navigateur n'appelle
# que le studio ; c'est lui qui relaie /api/parallax/* vers le parallaxe côté
# serveur, par le réseau interne. Le parallaxe n'a donc PAS besoin de domaine
# public (ni de CORS) :
#
#   studio → port 3000   ex. https://studio.exemple.com
#
# Onglet « Environment » : rien d'obligatoire. `PARALLAX_INTERNAL_URL` a pour
# défaut le nom de service compose du parallaxe et n'a besoin d'être posé que
# pour pointer ailleurs :
#
#   PARALLAX_INTERNAL_URL=http://parallax:8100   (défaut)
#
# C'est une variable de RUNTIME (plus de `NEXT_PUBLIC_*` inliné au build) : la
# changer n'impose plus de reconstruire le studio.

services:
  parallax:
    build:
      context: ./parallax
    restart: unless-stopped
    # Pas de `ports:` ni de domaine — le studio le joint par le réseau interne.
    # `expose` documente le port d'écoute sans le réserver sur l'hôte.
    expose:
      - "8100"
    healthcheck:
      # python-slim n'a ni curl ni wget : l'interpréteur fait l'affaire.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      # Le premier import charge torch + depthflow : lent au démarrage à froid.
      start_period: 180s
      retries: 5
    networks:
      - dokploy-network

  studio:
    build:
      # La racine du dépôt : l'image a besoin de `web/` ET de `prompts/`.
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # URL du parallaxe telle que le studio la joint côté serveur, par le
      # réseau `dokploy-network`. Variable de runtime : pas de rebuild pour la
      # changer. Défaut = nom de service compose du parallaxe.
      PARALLAX_INTERNAL_URL: ${PARALLAX_INTERNAL_URL:-http://parallax:8100}
    # Pas de `depends_on` sur la santé du parallaxe, contrairement au compose
    # local : en production le studio doit rester debout même quand le parallaxe
    # tombe (torch est gourmand, un OOM est plausible sur une petite VPS). Le
    # panneau affiche déjà un repli quand /api/parallax/health ne répond pas ;
    # lier les deux ferait tomber tout le site pour une fonctionnalité secondaire.
    networks:
      - dokploy-network

# Réseau créé par Dokploy à son installation : c'est celui où vit son Traefik.
# `external: true` = ne pas le créer, s'y rattacher.
networks:
  dokploy-network:
    external: true
